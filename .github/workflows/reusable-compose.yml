name: run docker compose

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-24.04
      compose_file:
        type: string
        default: docker-compose.yml
        required: true
      #path:
      #  type: string
      #  default: ${PWD}
      version:
        type: string
        default: latest
      api_v2:
        type: boolean
        default: false
      upload_mapping:
        type: boolean
        default: false
      project_name:
        type: string
        default: fnm

permissions:
  contents: read

jobs:
  run_test:
    runs-on: ${{ inputs.runner}}
    env:
      DEBIAN_FRONTEND: noninteractive
      COMPOSE_FILE: ${{ inputs.compose_file}}   
      FNM_VERSION: ${{ inputs.version}}
      FNM_WEB_API_V2: ${{ inputs.api_v2}}
      FNM_NOT_UPLOAD_ASN_MAPPING: ${{ inputs.upload_mapping}}
      COMPOSE_PROJECT_NAME: ${{ inputs.project_name}}
      FNM_PATH: ${{ github.workspace }}


    steps:
        - uses: actions/checkout@v6
        - run: sudo apt update && sudo apt install -y pwgen
        - name: Generate .env file
          env:
            FNM_PATH: ${{ github.workspace }}
          run: |
            cat > .env << EOF
            FNM_PATH=${{ github.workspace }}
            FNM_VERSION=${{ env.FNM_VERSION}}
            FNM_WEB_API_V2=${{ env.FNM_WEB_API_V2}}
            FNM_NOT_UPLOAD_ASN_MAPPING=${{ env.FNM_NOT_UPLOAD_ASN_MAPPING}}

            COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME}}
            COMPOSE_FILE=${{ env.COMPOSE_FILE}}
            EOF
            cat .env
            echo -e "${FNM_PATH}"
        - run:  docker compose config
        - name: Pull images
          run: docker compose pull
        - name: Clean volumes
          run: docker compose down --volumes --remove-orphans || true
        - name: Remove storage dir
          run: rm -rf ./storages 
        - name: Init secrets
          run: ./scripts/init_secrets.sh
        - name: Recreate volumes
          run: ./scripts/init_storage_default_dirs.sh
        - name: Run docker compose
          run: docker compose up -d --wait
        - name: Docker diagnostics
          if: failure()
          run: |
            echo "===== docker compose ps ====="
            docker compose ps -a

            echo
            echo "===== unhealthy containers ====="
            docker ps -a \
              --filter health=unhealthy \
              --format '{{.ID}}' |
            while read -r container; do
              [ -n "$container" ] || continue

              name="$(docker inspect --format '{{.Name}}' "$container")"
              echo
              echo "----- ${name#/} -----"
              docker inspect \
                --format '{{json .State.Health}}' \
                "$container"
            done

            echo
            echo "===== docker compose logs ====="
            docker compose logs --no-color --timestamps
        - run: docker compose ps -a
        - run: docker compose logs fastnetmon


