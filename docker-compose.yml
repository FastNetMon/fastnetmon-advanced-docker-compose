include:
  - volumes.yml
  - networks.yml
  - secrets.yml

services:

  fastnetmon:
    image: fastnetmon/fastnetmon-advanced:${FNM_VERSION:-latest}
    restart: unless-stopped
    networks:
      - fastnetmon-network
    secrets:
      - source: mongo_password
        target: /etc/fastnetmon/keychain/.mongo_fastnetmon_password
    cap_add:
      - NET_ADMIN
      - CAP_IPC_LOCK
    environment:
      MONGO_USERNAME: administrator
      MONGO_HOST: mongo
      FNM_ARGS: --log_to_console
      FNM_NOT_UPLOAD_ASN_MAPPING: ${FNM_NOT_UPLOAD_ASN_MAPPING:-false}
    volumes:
      - fastnetmon_logs:/var/log/fastnetmon/
      - ${FNM_PATH}/services/fastnetmon/custom-entry.sh:/custom-entry.sh:ro
      - ${FNM_PATH}/seeds/fastnetmon/:/etc/fastnetmon/
    ports:
      - 6343:6343/udp
      - 2055:2055/udp
    entrypoint: [ "/bin/bash", "/custom-entry.sh" ]
    healthcheck:
      test: [ "CMD-SHELL", "/opt/fastnetmon/app/bin/fcli show system_counters | grep -q fastnetmon_version" ]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 30s
